<!DOCTYPE html>
<html>
<head>
  <title>Student Expense Tracker Test</title>
</head>

<body>

<h2>Register</h2>

<input id="name" placeholder="name"><br><br>
<input id="email" placeholder="email"><br><br>
<input id="password" placeholder="password"><br><br>

<button onclick="register()">Register</button>

<hr>

<h2>Login</h2>

<input id="loginEmail" placeholder="email"><br><br>
<input id="loginPassword" placeholder="password"><br><br>

<button onclick="login()">Login</button>

<hr>

<h2>Add Expense</h2>

<input id="title" placeholder="Expense Title"><br><br>
<input id="amount" placeholder="Amount"><br><br>
<input id="category" placeholder="Category"><br><br>

<button onclick="addExpense()">Add Expense</button>

<script>

// Logged in user id
let loggedInUserId = null;

// ================= REGISTER =================
function register() {
  fetch("http://localhost:5000/auth/register", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      name: document.getElementById("name").value,
      email: document.getElementById("email").value,
      password: document.getElementById("password").value
    })
  })
  .then(res => res.json())
  .then(data => {
    alert("REGISTER: " + JSON.stringify(data));
  })
  .catch(err => alert(err));
}

// ================= LOGIN =================
function login() {
  fetch("http://localhost:5000/auth/login", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      email: document.getElementById("loginEmail").value,
      password: document.getElementById("loginPassword").value
    })
  })
  .then(res => res.json())
  .then(data => {

    if (data.user) {

      loggedInUserId = data.user.id;
      localStorage.setItem("userId", data.user.id);
      localStorage.setItem("userName", data.user.name);
      localStorage.setItem("token", data.token);

      alert(
        "Login Successful\n" +
        "User ID: " + loggedInUserId +
        "\nName: " + data.user.name
      );

    } else {

      alert(data.message);

    }

  })
  .catch(err => alert(err));
}

// ================= ADD EXPENSE =================
function addExpense() {

  if (!loggedInUserId) {
    alert("Please login first");
    return;
  }

  fetch("http://localhost:5000/expenses/add", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      user_id: loggedInUserId,
      title: document.getElementById("title").value,
      amount: document.getElementById("amount").value,
      category: document.getElementById("category").value,
      expense_date: "2026-05-22"
    })
  })
  .then(res => res.json())
  .then(data => {
    alert("EXPENSE: " + JSON.stringify(data));
  })
  .catch(err => alert(err));
}

</script>

</body>
</html>
